name: 打包悬浮球

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 打包
        run: pyinstaller --noconfirm --clean "打包.spec"

      - name: 上传构建产物（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-widget-exe
          path: dist/*.exe
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/*.exe --clobber --repo "${GITHUB_REPOSITORY}"
